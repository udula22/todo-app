<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <div class="header">
            <div>
                <h1>My Tasks</h1>
                <p class="subtitle" id="dateLabel"></p>
            </div>
            <button class="dark-btn" id="darkModeBtn">🌙 Dark</button>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-num" id="statTotal">0</div>
                <div class="stat-label">Total</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="statDone">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="statLeft">0</div>
                <div class="stat-label">Remaining</div>
            </div>
        </div>

        <div class="progress-wrap">
            <div class="progress-label">
                <span>Progress</span>
                <span id="progressPct">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="card">
            <div class="add-row">
                <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="100">
                <select id="prioritySel">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
                <input type="date" id="dateInput">
                <button class="add-btn" id="addTaskBtn">+ Add</button>
            </div>
            <input type="text" id="searchInput" placeholder="🔍 Search tasks...">
        </div>

        <div class="filter-row">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="overdue">Overdue</button>
            <button class="clear-btn" id="clearCompletedBtn">Clear done</button>
        </div>

        <div class="sort-row">
            <span class="sort-label">Sort by</span>
            <select class="sort-sel" id="sortSel">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="priority">Priority</option>
                <option value="duedate">Due date</option>
            </select>
        </div>

        <div class="task-list" id="taskList"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
